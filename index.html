<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>RustDesk Web Client</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RustDesk Web" />
    <meta name="theme-color" content="#1d8ef5" />
    <meta
      name="description"
      content="Access RustDesk remote desktops from your browser, with controls for phones and computers."
    />
    <meta property="og:title" content="RustDesk Web Client" />
    <meta
      property="og:description"
      content="Access RustDesk remote desktops from your browser, with controls for phones and computers."
    />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rd_web_theme');
          var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        pointer-events: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        background-color: #f8fafc;
        background-image:
          radial-gradient(circle at 50% 34%, rgba(29, 142, 245, 0.12), transparent 56%),
          radial-gradient(rgba(15, 23, 42, 0.055) 1px, transparent 1px);
        background-size: 100% 100%, 24px 24px;
        color: #0f172a;
        opacity: 1;
        transition: opacity 220ms ease, transform 220ms ease;
      }
      html[data-theme="dark"] #app-splash {
        background-color: #0b1120;
        background-image:
          radial-gradient(circle at 50% 34%, rgba(33, 150, 243, 0.2), transparent 56%),
          radial-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        color: #f1f5f9;
      }
      #app-splash.is-hidden {
        opacity: 0;
        transform: scale(1.015);
      }
      .rd-splash-icon {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 20px 44px -12px rgba(11, 99, 206, 0.48), 0 2px 8px rgba(15, 23, 42, 0.16);
      }
      .rd-splash-icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .rd-splash-title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .rd-splash-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: -10px;
        font-size: 12px;
        color: #64748b;
      }
      html[data-theme="dark"] .rd-splash-meta {
        color: #94a3b8;
      }
      .rd-splash-chip {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(29, 142, 245, 0.1);
        color: #0b63ce;
        font-weight: 500;
      }
      html[data-theme="dark"] .rd-splash-chip {
        background: rgba(56, 189, 248, 0.12);
        color: #7dd3fc;
      }
      .rd-splash-bar {
        position: relative;
        width: 152px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(100, 116, 139, 0.22);
      }
      .rd-splash-bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2196f3, #38bdf8);
        animation: rd-splash-slide 1.15s ease-in-out infinite;
      }
      @keyframes rd-splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(240%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
        .rd-splash-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="rd-splash-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2196F3"/>
              <stop offset="100%" stop-color="#0B63CE"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" fill="url(#sp-bg)"/>
          <rect x="116" y="138" width="280" height="190" rx="34" fill="none" stroke="#FFFFFF" stroke-width="20"/>
          <g transform="translate(256 233)">
            <path d="M -42 -4 A 42 42 0 0 1 31 -28" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
            <path d="M 42 4 A 42 42 0 0 1 -31 28" fill="none" stroke="#93C5FD" stroke-width="18" stroke-linecap="round"/>
            <circle cx="34" cy="-25" r="10.5" fill="#FFFFFF"/>
            <circle cx="-34" cy="25" r="10.5" fill="#93C5FD"/>
            <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
          </g>
          <path d="M 212 368 H 300" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
          <path d="M 256 330 V 366" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="rd-splash-title">RustDesk Web</h1>
      <div class="rd-splash-meta">
        <span class="rd-splash-chip">WebCodecs</span>
        <span class="rd-splash-chip">WebRTC</span>
        <span class="rd-splash-chip">E2E</span>
      </div>
      <div class="rd-splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
