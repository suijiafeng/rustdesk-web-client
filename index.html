<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>RustDesk Web Client</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RustDesk Web" />
    <meta name="theme-color" content="#1d8ef5" />
    <meta
      name="description"
      content="Access RustDesk remote desktops from your browser, with controls for phones and computers."
    />
    <meta property="og:title" content="RustDesk Web Client" />
    <meta
      property="og:description"
      content="Access RustDesk remote desktops from your browser, with controls for phones and computers."
    />
    <meta property="og:type" content="website" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: #f8fafc;
        transition: opacity 200ms ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
      }
      .rd-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(29, 142, 245, 0.2);
        border-top-color: #1d8ef5;
        border-radius: 50%;
        animation: rd-spin 0.75s linear infinite;
      }
      @keyframes rd-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: #0b1120; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
        .rd-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="rd-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
