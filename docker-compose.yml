services:
  rustdesk-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustdesk-web-client:latest
    container_name: ${CONTAINER_NAME:-rustdesk-web-client}
    restart: unless-stopped
    ports:
      # Default host port 21120 avoids common 3000/8080 conflicts and RustDesk hbbs/hbbr ports (21114-21119).
      # Override anytime via HOST_PORT=<port> or ./deploy.sh --port <port>.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-21120}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      RUSTDESK_GATEWAY_TOKEN: "${RUSTDESK_GATEWAY_TOKEN:?Set RUSTDESK_GATEWAY_TOKEN before starting production}"
      RUSTDESK_ALLOWED_ORIGINS: "${RUSTDESK_ALLOWED_ORIGINS:-}"
      RUSTDESK_REQUIRE_ORIGIN: "${RUSTDESK_REQUIRE_ORIGIN:-false}"
      RUSTDESK_TRUSTED_PROXIES: "${RUSTDESK_TRUSTED_PROXIES:-}"
      RUSTDESK_CLIENT_IP_HEADER: "${RUSTDESK_CLIENT_IP_HEADER:-x-forwarded-for}"
      RUSTDESK_ALLOW_PRIVATE_TARGETS: "${RUSTDESK_ALLOW_PRIVATE_TARGETS:-false}"
      RUSTDESK_ALLOWED_TARGET_PORTS: "${RUSTDESK_ALLOWED_TARGET_PORTS:-}"
      RUSTDESK_ENABLE_WEBRTC: "${RUSTDESK_ENABLE_WEBRTC:-false}"
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
