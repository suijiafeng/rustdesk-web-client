name: reference-client-ci

on:
  pull_request:
    paths:
      - 'reference-client/**'
      - '.github/workflows/reference-client-ci.yml'
  push:
    branches: [main]
    paths:
      - 'reference-client/**'
      - '.github/workflows/reference-client-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
