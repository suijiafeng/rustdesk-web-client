name: Feature
description: A change you want evaluated
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and what they cannot do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What should stay out of scope
  - type: dropdown
    id: security
    attributes:
      label: Could this widen access to a host or the gateway?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
